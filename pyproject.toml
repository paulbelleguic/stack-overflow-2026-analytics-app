[project]
name = "stack-overflow-2026-analytics-app"
version = "0.1.0"
description = "A shared student analytics app about AI rollout in the French developer market"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
exploration = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
