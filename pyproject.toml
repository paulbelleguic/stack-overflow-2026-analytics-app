[project]
name = "stack-overflow-2026-analytics-app"
version = "0.1.0"
description = "Shared core for a student analytics app about an AI coding-assistant pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
exploration = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
