name: Project checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          MPLBACKEND: Agg
      - name: Check that raw data is not tracked
        run: test -z "$(git ls-files data .venv)"
